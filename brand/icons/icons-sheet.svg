<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1522 730" width="1522" height="730">
  <rect width="1522" height="730" fill="#FFF6EC"/>
  <text x="56" y="86" font-family="Plus Jakarta Sans" font-size="32" font-weight="800" fill="#1F2A44">Human First AI — icons</text>
  <text x="56" y="116" font-family="Plus Jakarta Sans" font-size="16" fill="#68728A">24px grid · 2px stroke · round caps · every icon replaces a piece of jargon with an everyday object.</text>
  <g transform="translate(56,146) scale(2.1)" fill="none" stroke="#1F2A44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21h13"/>
        <path d="M11.4 21v-9.4a4.8 4.8 0 0 1 9.6 0V21"/>
        <path d="M2.3 14.6h6.6"/>
        <path d="m6.2 11.6 3 3-3 3"/></g>
  <text x="128" y="170" font-family="Plus Jakarta Sans" font-size="18" font-weight="700" fill="#1F2A44">Open Access</text>
  <text x="128" y="192" font-family="Plus Jakarta Sans" font-size="13" fill="#C24D00">replaces: API / platform / gateway</text>
  <text x="128" y="214" font-family="Plus Jakarta Sans" font-size="13" fill="#68728A">A threshold anyone may cross. No paywall, no credent</text>
  <text x="128" y="231" font-family="Plus Jakarta Sans" font-size="13" fill="#68728A">ial, no gatekeeper.</text>
  <g transform="translate(526,146) scale(2.1)" fill="none" stroke="#1F2A44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3v4l4.5-4H20a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1Z"/>
        <path d="M7 8.5h10"/><path d="M7 12h6"/></g>
  <text x="598" y="170" font-family="Plus Jakarta Sans" font-size="18" font-weight="700" fill="#1F2A44">Plain Language</text>
  <text x="598" y="192" font-family="Plus Jakarta Sans" font-size="13" fill="#C24D00">replaces: NLP / LLM / prompt</text>
  <text x="598" y="214" font-family="Plus Jakarta Sans" font-size="13" fill="#68728A">Words a twelve-year-old can read on the first pass.</text>
  <text x="598" y="231" font-family="Plus Jakarta Sans" font-size="13" fill="#68728A"></text>
  <g transform="translate(996,146) scale(2.1)" fill="none" stroke="#1F2A44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.4"/>
        <circle cx="12" cy="6.8" r="1.65" fill="currentColor" stroke="none"/>
        <circle cx="16.95" cy="10.39" r="1.65" fill="currentColor" stroke="none"/>
        <circle cx="15.06" cy="16.21" r="1.65" fill="currentColor" stroke="none"/>
        <circle cx="8.94" cy="16.21" r="1.65" fill="currentColor" stroke="none"/>
        <circle cx="7.05" cy="10.39" r="1.65" fill="currentColor" stroke="none"/></g>
  <text x="1068" y="170" font-family="Plus Jakarta Sans" font-size="18" font-weight="700" fill="#1F2A44">Learning Circle</text>
  <text x="1068" y="192" font-family="Plus Jakarta Sans" font-size="13" fill="#C24D00">replaces: neural network / training</text>
  <text x="1068" y="214" font-family="Plus Jakarta Sans" font-size="13" fill="#68728A">People teaching each other around an open centre, no</text>
  <text x="1068" y="231" font-family="Plus Jakarta Sans" font-size="13" fill="#68728A">t a lecture from above.</text>
  <g transform="translate(56,278) scale(2.1)" fill="none" stroke="#1F2A44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/>
        <path d="m15.2 8.8-2 4.4-4.4 2 2-4.4Z"/>
        <path d="M12 3.5v1.8"/><path d="M12 18.7v1.8"/>
        <path d="M3.5 12h1.8"/><path d="M18.7 12h1.8"/></g>
  <text x="128" y="302" font-family="Plus Jakarta Sans" font-size="18" font-weight="700" fill="#1F2A44">Human Compass</text>
  <text x="128" y="324" font-family="Plus Jakarta Sans" font-size="13" fill="#C24D00">replaces: optimisation / alignment</text>
  <text x="128" y="346" font-family="Plus Jakarta Sans" font-size="13" fill="#68728A">Human judgement sets the direction. The technology f</text>
  <text x="128" y="363" font-family="Plus Jakarta Sans" font-size="13" fill="#68728A">ollows.</text>
  <g transform="translate(526,278) scale(2.1)" fill="none" stroke="#1F2A44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 3.6a4.6 4.6 0 0 0-1.1 7.5l-8 8a1.8 1.8 0 0 0 2.5 2.5l8-8a4.6 4.6 0 0 0 5.2-6.7l-2.9 2.9-2.4-2.4 2.9-2.9a4.6 4.6 0 0 0-4.2-.9Z"/>
        <path d="M6.6 17.4 8 18.8"/></g>
  <text x="598" y="302" font-family="Plus Jakarta Sans" font-size="18" font-weight="700" fill="#1F2A44">Shared Tool</text>
  <text x="598" y="324" font-family="Plus Jakarta Sans" font-size="13" fill="#C24D00">replaces: machine-learning pipeline</text>
  <text x="598" y="346" font-family="Plus Jakarta Sans" font-size="13" fill="#68728A">AI is a tool you pick up, like a pen or a spade. It </text>
  <text x="598" y="363" font-family="Plus Jakarta Sans" font-size="13" fill="#68728A">is not a mind.</text>
  <g transform="translate(996,278) scale(2.1)" fill="none" stroke="#1F2A44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 20.5h17"/>
        <path d="M12 20.5v-9"/>
        <path d="M12 11.5C12 8.2 9.6 5.8 6.3 5.8c0 3.3 2.4 5.7 5.7 5.7Z"/>
        <path d="M12 13.4c0-2.7 2-4.7 4.7-4.7 0 2.7-2 4.7-4.7 4.7Z"/></g>
  <text x="1068" y="302" font-family="Plus Jakarta Sans" font-size="18" font-weight="700" fill="#1F2A44">Everyday Growth</text>
  <text x="1068" y="324" font-family="Plus Jakarta Sans" font-size="13" fill="#C24D00">replaces: scale / exponential curve</text>
  <text x="1068" y="346" font-family="Plus Jakarta Sans" font-size="13" fill="#68728A">Real progress for one family, one stall, one classro</text>
  <text x="1068" y="363" font-family="Plus Jakarta Sans" font-size="13" fill="#68728A">om at a time.</text>
  <g transform="translate(56,410) scale(2.1)" fill="none" stroke="#1F2A44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 13.2h-10a1 1 0 0 1-1-1V4.8a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v7.4a1 1 0 0 1-1 1Z"/>
        <path d="M7.5 13.2v3.1l3.4-3.1"/>
        <path d="M16.5 8.6h2a1 1 0 0 1 1 1v6.3a1 1 0 0 1-1 1h-1.1v3l-3.3-3h-3.3"/></g>
  <text x="128" y="434" font-family="Plus Jakarta Sans" font-size="18" font-weight="700" fill="#1F2A44">Community Voice</text>
  <text x="128" y="456" font-family="Plus Jakarta Sans" font-size="13" fill="#C24D00">replaces: user feedback / telemetry</text>
  <text x="128" y="478" font-family="Plus Jakarta Sans" font-size="13" fill="#68728A">The people in the room decide. Not a head office som</text>
  <text x="128" y="495" font-family="Plus Jakarta Sans" font-size="13" fill="#68728A">ewhere else.</text>
  <g transform="translate(526,410) scale(2.1)" fill="none" stroke="#1F2A44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7.2-3.3 7.2-8.6V5.6L12 3 4.8 5.6v6.8C4.8 17.7 12 21 12 21Z"/>
        <path d="m8.8 12.2 2.3 2.3 4.1-4.6"/></g>
  <text x="598" y="434" font-family="Plus Jakarta Sans" font-size="18" font-weight="700" fill="#1F2A44">Safe Guardrails</text>
  <text x="598" y="456" font-family="Plus Jakarta Sans" font-size="13" fill="#C24D00">replaces: security / compliance</text>
  <text x="598" y="478" font-family="Plus Jakarta Sans" font-size="13" fill="#68728A">Privacy, honesty about limits, and a way to say no.</text>
  <text x="598" y="495" font-family="Plus Jakarta Sans" font-size="13" fill="#68728A"></text>
  <g transform="translate(996,410) scale(2.1)" fill="none" stroke="#1F2A44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 12.6 12.6 20.4a1.7 1.7 0 0 1-2.4 0l-6.2-6.2a1.7 1.7 0 0 1-.5-1.2V5a1.7 1.7 0 0 1 1.7-1.7h8a1.7 1.7 0 0 1 1.2.5l6.2 6.2a1.7 1.7 0 0 1 0 2.6Z"/>
        <circle cx="7.9" cy="7.9" r="1.5"/>
        <path d="M4.6 19.4 19.4 4.6"/></g>
  <text x="1068" y="434" font-family="Plus Jakarta Sans" font-size="18" font-weight="700" fill="#1F2A44">No Cost</text>
  <text x="1068" y="456" font-family="Plus Jakarta Sans" font-size="13" fill="#C24D00">replaces: pricing / tier / upgrade</text>
  <text x="1068" y="478" font-family="Plus Jakarta Sans" font-size="13" fill="#68728A">Nothing we teach has ever had a price on it.</text>
  <text x="1068" y="495" font-family="Plus Jakarta Sans" font-size="13" fill="#68728A"></text>
  <g transform="translate(56,542) scale(2.1)" fill="none" stroke="#1F2A44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/>
        <path d="M3.5 12h17"/>
        <path d="M12 3.5a13 13 0 0 1 0 17a13 13 0 0 1 0-17Z"/></g>
  <text x="128" y="566" font-family="Plus Jakarta Sans" font-size="18" font-weight="700" fill="#1F2A44">Your Language</text>
  <text x="128" y="588" font-family="Plus Jakarta Sans" font-size="13" fill="#C24D00">replaces: localisation / i18n</text>
  <text x="128" y="610" font-family="Plus Jakarta Sans" font-size="13" fill="#68728A">Taught in the language people actually think in.</text>
  <text x="128" y="627" font-family="Plus Jakarta Sans" font-size="13" fill="#68728A"></text>
  <g transform="translate(526,542) scale(2.1)" fill="none" stroke="#1F2A44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 11.5V5.3a1.6 1.6 0 0 1 3.2 0v5"/>
        <path d="M11.7 10.3V4.4a1.6 1.6 0 0 1 3.2 0v6"/>
        <path d="M14.9 10.8V6.6a1.6 1.6 0 0 1 3.2 0v7.6a6.3 6.3 0 0 1-6.3 6.3h-.9a5.6 5.6 0 0 1-4.2-1.9l-3-3.4a1.6 1.6 0 0 1 2.3-2.2l2.5 2.2"/></g>
  <text x="598" y="566" font-family="Plus Jakarta Sans" font-size="18" font-weight="700" fill="#1F2A44">Hands On</text>
  <text x="598" y="588" font-family="Plus Jakarta Sans" font-size="13" fill="#C24D00">replaces: onboarding / tutorial</text>
  <text x="598" y="610" font-family="Plus Jakarta Sans" font-size="13" fill="#68728A">People learn by doing it once with someone beside th</text>
  <text x="598" y="627" font-family="Plus Jakarta Sans" font-size="13" fill="#68728A">em.</text>
  <g transform="translate(996,542) scale(2.1)" fill="none" stroke="#1F2A44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20.5h18"/>
        <path d="M9 20.5V9.8a4.2 4.2 0 0 1 8.4 0v10.7"/>
        <path d="M9 20.5V6.2L4.2 3.5v17"/>
        <circle cx="6.4" cy="12.4" r="0.95" fill="currentColor" stroke="none"/></g>
  <text x="1068" y="566" font-family="Plus Jakarta Sans" font-size="18" font-weight="700" fill="#1F2A44">Open Door</text>
  <text x="1068" y="588" font-family="Plus Jakarta Sans" font-size="13" fill="#C24D00">replaces: the mark, in running text</text>
  <text x="1068" y="610" font-family="Plus Jakarta Sans" font-size="13" fill="#68728A">The movement itself. Use only where the full mark wi</text>
  <text x="1068" y="627" font-family="Plus Jakarta Sans" font-size="13" fill="#68728A">ll not fit.</text>

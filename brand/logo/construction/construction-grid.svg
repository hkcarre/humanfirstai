ine x1="616" y1="0" x2="616" y2="896" stroke="#68728A" stroke-width="0.5" opacity="0.25"/><line x1="0" y1="616" x2="896" y2="616" stroke="#68728A" stroke-width="0.5" opacity="0.25"/><line x1="672" y1="0" x2="672" y2="896" stroke="#68728A" stroke-width="1" opacity="0.5"/><line x1="0" y1="672" x2="896" y2="672" stroke="#68728A" stroke-width="1" opacity="0.5"/><line x1="728" y1="0" x2="728" y2="896" stroke="#68728A" stroke-width="0.5" opacity="0.25"/><line x1="0" y1="728" x2="896" y2="728" stroke="#68728A" stroke-width="0.5" opacity="0.25"/><line x1="784" y1="0" x2="784" y2="896" stroke="#68728A" stroke-width="0.5" opacity="0.25"/><line x1="0" y1="784" x2="896" y2="784" stroke="#68728A" stroke-width="0.5" opacity="0.25"/><line x1="840" y1="0" x2="840" y2="896" stroke="#68728A" stroke-width="0.5" opacity="0.25"/><line x1="0" y1="840" x2="896" y2="840" stroke="#68728A" stroke-width="0.5" opacity="0.25"/><line x1="896" y1="0" x2="896" y2="896" stroke="#68728A" stroke-width="1" opacity="0.5"/><line x1="0" y1="896" x2="896" y2="896" stroke="#68728A" stroke-width="1" opacity="0.5"/>

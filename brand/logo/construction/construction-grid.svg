  <g transform="translate(956,60)">
    <text x="0" y="0" font-family="Plus Jakarta Sans" font-size="22" font-weight="800" fill="#1F2A44">How the mark is built</text>
    <text x="0" y="36" font-family="Plus Jakarta Sans" font-size="15" font-weight="400" fill="#68728A">64 × 64 unit grid. Every value sits on a 0.5u step.</text>
    <text x="0" y="62" font-family="Plus Jakarta Sans" font-size="15" font-weight="400" fill="#68728A">Frame: semicircle, r = 15, springline y = 30, stroke 5.</text>
    <text x="0" y="88" font-family="Plus Jakarta Sans" font-size="15" font-weight="400" fill="#68728A">Opening: concentric, r = 12.5, so the frame is 5u thick everywhere.</text>
    <text x="0" y="114" font-family="Plus Jakarta Sans" font-size="15" font-weight="400" fill="#68728A">Leaf: hinge edge x = 20, free edge x = 7, top edge at exactly 30°.</text>
    <text x="0" y="140" font-family="Plus Jakarta Sans" font-size="15" font-weight="400" fill="#68728A">Hinge gap: 2u of background between leaf and frame.</text>
    <text x="0" y="166" font-family="Plus Jakarta Sans" font-size="15" font-weight="400" fill="#68728A">Knob: r 2.4 at (10.5, 34) — the only detail that may be dropped.</text>
    <text x="0" y="192" font-family="Plus Jakarta Sans" font-size="15" font-weight="400" fill="#68728A">Ground: y 51.5, 3.5u deep, 4u wider than the doorway on each side.</text>
    <text x="0" y="218" font-family="Plus Jakarta Sans" font-size="15" font-weight="400" fill="#68728A"></text>
    <text x="0" y="244" font-family="Plus Jakarta Sans" font-size="15" font-weight="400" fill="#1F2A44">The lit opening is enclosed by Deep Ink on all four sides.</text>
    <text x="0" y="270" font-family="Plus Jakarta Sans" font-size="15" font-weight="400" fill="#1F2A44">Sunrise is 2.19:1 on cream, so it must never touch a light</text>
    <text x="0" y="296" font-family="Plus Jakarta Sans" font-size="15" font-weight="400" fill="#1F2A44">background directly. The geometry enforces that, not a rule.</text>
  </g>
</svg>
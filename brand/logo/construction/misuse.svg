    </g>
    <text x="50" y="346" font-family="Plus Jakarta Sans" font-size="15" font-weight="700" fill="#CE3E22">Do not rotate or mirror it</text>
    <text x="50" y="366" font-family="Plus Jakarta Sans" font-size="13" font-weight="500" fill="#68728A">A door is architecture. Tilt it and it stops being one.</text>

    <text x="480" y="346" font-family="Plus Jakarta Sans" font-size="15" font-weight="700" fill="#CE3E22">Do not stretch it</text>
    <text x="480" y="366" font-family="Plus Jakarta Sans" font-size="13" font-weight="500" fill="#68728A">Scale both axes by the same number, always.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1410 1036" width="1410" height="1036">
  <rect width="100%" height="100%" fill="#FFF6EC"/>
  <text x="60" y="70" font-family="Plus Jakarta Sans" font-size="32" font-weight="800" fill="#1F2A44">Nine ways to get it wrong</text>
  <text x="60" y="100" font-family="Plus Jakarta Sans" font-size="16" font-weight="500" fill="#68728A">If a layout does any of these, it is not our mark any more. Send it back.</text>
  <g transform="translate(60,150)">
    <rect x="-10" y="-10" width="210" height="180" fill="#FFFFFF" stroke="#68728A" stroke-width="1" opacity="0.6"/>
    <svg x="0" y="0" width="190" height="160" viewBox="0 0 190 160" overflow="hidden"><g transform="translate(78,78) rotate(-18) translate(-78,-78) scale(2.4)"><path d="M27,51.5 L27,30 A12.5,12.5 0 0 1 52,30 L52,51.5 Z" fill="#FF8A3D"/>
  <path d="M24.5,51.5 L24.5,30 A15,15 0 0 1 54.5,30 L54.5,51.5" fill="none" stroke="#1F2A44" stroke-width="5"/>
  <path d="M20,51.5 L20,16.5 L7,9 L7,51.5 Z" fill="#1F2A44"/>

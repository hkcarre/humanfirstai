    <text x="910" y="346" font-family="Plus Jakarta Sans" font-size="15" font-weight="700" fill="#CE3E22">Do not add a gradient or a glow</text>
    <text x="910" y="366" font-family="Plus Jakarta Sans" font-size="13" font-weight="500" fill="#68728A">No sci-fi sheen. We are warm, flat and printed.</text>
